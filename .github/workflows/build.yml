name: Portable Builds

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TubeSounds-windows.exe
          - os: macos-latest
            artifact: TubeSounds-macos.zip
          - os: ubuntu-latest
            artifact: TubeSounds-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TubeSounds --collect-all imageio_ffmpeg --collect-data tubesounds tubesounds_app.py
          Move-Item dist/TubeSounds.exe dist/${{ matrix.artifact }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name TubeSounds --collect-all imageio_ffmpeg --collect-data tubesounds tubesounds_app.py
          cd dist && ditto -c -k --keepParent TubeSounds.app ${{ matrix.artifact }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TubeSounds --collect-all imageio_ffmpeg --collect-data tubesounds tubesounds_app.py
          mv dist/TubeSounds dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
